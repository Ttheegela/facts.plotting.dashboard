[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facts-dashboard"
version = "1.0.0"
description = "Generate interactive HTML dashboards from FACTS sea-level projection outputs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Tarun Theegela", email = "tt633@rutgers.edu" }
]
keywords = ["sea-level", "FACTS", "climate", "bokeh", "visualization"]
dependencies = [
    "bokeh>=3.8",
    "xarray>=2023.1",
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
    "netCDF4>=1.6",
]

[project.scripts]
facts-dashboard = "facts_dashboard:main"

[project.urls]
Repository = "https://github.com/facts-workbench/facts.plotting.dashboard"

[tool.setuptools]
py-modules = ["facts_dashboard"]
